name: Deploy Ing-Service SC to GitHub Pages

on:
  push:
    branches:
      - principal
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar archivos del repositorio
        uses: actions/checkout@v6

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Extraer sitio web
        run: |
          rm -rf site extracted-site
          mkdir -p site extracted-site
          unzip -q Ing-Service-SC-Web-v3-GitHub.zip -d extracted-site
          cp -R extracted-site/ingservice-web/. site/
          touch site/.nojekyll

      - name: Cargar sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
